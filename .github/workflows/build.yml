name: Bygg APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg debug-APK
        run: ./gradlew assembleMainlineDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHealth-apk
          path: app/build/outputs/apk/mainline/debug/*.apk
